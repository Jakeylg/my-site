<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications — Greenfield Group</title>
  <meta name="description" content="Research publications from the Greenfield Group and collaborators.">
  <link rel="canonical" href="https://imineswitch.com/publications.html">
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
  <div id="top"></div>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <h1>Publications</h1>
    <p class="muted" style="margin-top:-6px">
      For other publications and biographical sketches, <a href="#other-pubs">click here</a>.
    </p>

      <div class="controls">
        <label class="sr-only" for="pubSearch">Filter publications</label>
        <input type="search" id="pubSearch" placeholder="Filter by title or author…">
        <label class="sr-only" for="yearFilter">Filter publications by year</label>
        <select id="yearFilter">
          <option value="">All years</option>
        </select>
      </div>

      <!-- JSON/JS-driven list will render here -->
      <div id="pubList" class="publist" aria-live="polite"></div>

      <noscript>
        <p><strong>Note:</strong> Enable JavaScript to view the publications list.</p>
      </noscript>
    </div>
  </main>

<section id="other-pubs" class="section bg-soft">
  <div class="container">
    <h2>Other publications &amp; biographical sketches</h2>
    <p class="muted" style="margin:6px 0 16px">Biographical sketches, News &amp; Views and other items.</p>
    <div id="otherList" class="publist" aria-live="polite"></div>
  </div>
</section>

<div class="container" style="text-align:center; margin:24px auto;">
  <a href="#top" class="btn btn-gray">Back to top</a>
</div>
<script src="publications.js?v=5" defer></script>

  <footer>
    <div class="container" style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div>© <span id="year"></span> Greenfield Group</div>
    </div>
  </footer>

  <script src="nav.js?v=2"></script>
  <script src="banner.js"></script>
</body>
</html>
